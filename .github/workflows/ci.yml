name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Engine structures are version-specific and z-engine tracks one PHP minor per
# release line, but the "8.4.x-dev || 8.5.x-dev" constraint lets composer
# resolve the line matching each runner's PHP - so this package runs on
# PHP 8.4 and 8.5 in parallel, and every engine-touching job runs against
# both minors.
jobs:
  tests:
    name: Tests (release, NTS, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1, zend.assertions=1, opcache.jit=off
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Run test suite
        run: composer test

  tests-opcache:
    name: Tests (opcache, save_comments=0, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          # save_comments=0 is a normal production setting that makes doc comments
          # unavailable at runtime; this job is the permanent guard that nothing in the
          # runtime path ever reads one.
          ini-values: ffi.enable=1, zend.assertions=1, opcache.jit=off, opcache.enable=1, opcache.enable_cli=1, opcache.save_comments=0
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Run test suite without doc comments
        run: composer test

      # PreloadTest skips itself when opcache is absent, and this is the one job where opcache
      # is guaranteed present - so a silent skip here would mean preload.php goes unexecuted
      # everywhere. Asserting the extension is loaded first makes that impossible.
      - name: preload.php must actually be booted
        run: |
          php -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);' \
            || { echo "::error::Zend OPcache is not loaded - the preload test would silently skip"; exit 1; }
          composer test:preload

  benchmarks-smoke:
    name: Benchmarks (smoke, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1, zend.assertions=1, opcache.jit=off
          coverage: none

      - uses: ramsey/composer-install@v4

      # Asserts that the harness runs and reports, never that a number came out a certain
      # way - a CI job that fails on a timing is a job people learn to ignore.
      - name: Run every scenario at the smallest size
        run: composer bench:smoke

  analysis-tests:
    name: PHPStan extension tests (FFI disabled, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      # ffi.enable=0 is the assertion, not a convenience: the analysis layer has to work in
      # CI and in an IDE, neither of which can be assumed to have a usable FFI. Pinning it off
      # explicitly matters because ext-ffi is *loaded* on this runner by default - relying on
      # the default would leave the job passing for the wrong reason on a host that enables it.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: ffi.enable=0
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Run the analysis suite
        run: composer test:analysis

  # The analysis layer needs no engine, so it is the one thing that can (and should)
  # already run on the NEXT minor: an early warning for parser/reflection changes, not
  # a support statement. The engine-touching jobs stay off nightly until z-engine
  # bundles definitions for it.
  analysis-tests-nightly:
    name: PHPStan extension tests (PHP 8.6 nightly, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          ini-values: ffi.enable=0
          coverage: none

      # z-engine's platform constraint stops at the minors it has definitions for; the
      # analysis suite never boots it, so installing past the constraint is safe here.
      - name: Install dependencies (ignore the PHP platform requirement)
        run: composer install --no-interaction --no-progress --ignore-platform-req=php+

      - name: Run the analysis suite
        run: composer test:analysis

  generated-stubs:
    name: Generated stubs are up to date (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1
          coverage: none

      - uses: ramsey/composer-install@v4

      # The project analyses itself with stubs its own generator produced. Regenerating here
      # makes a generator change that stops matching them a failing build rather than a stale
      # file nobody re-runs. Running it per minor proves the stubs are version-independent.
      - name: Regenerate and compare
        run: composer stubs:check

  tests-internal-debug:
    name: Internal group (debug build, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    # The destructive eviction tests run destroy_zend_class() over a copied class entry while
    # its template is still live. On a release build a copy that released a block the template
    # still owns usually survives the test and crashes somewhere unrelated later; on a
    # --enable-debug build it is an assertion failure at the point of the mistake. There is no
    # official debug PHP image, so one is built here from the official image's own source.
    #
    # report_memleaks is off - see phpunit.xml.dist, which is the only place that can set it,
    # since PHPUnit propagates its <ini> block to process-isolated children and overrides any
    # -d given here. The short version: ClassSpecializer defers some frees to request end by
    # design, and the leak reporter counts exactly those. The Zend assertions, which are what
    # catch a copy freeing a block its template still owns, stay on.
    steps:
      - uses: actions/checkout@v7

      # Composer runs on a release PHP on the host; the debug container only needs to run the
      # already-installed PHPUnit, which is plain PHP.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Build the debug PHP image
        run: |
          docker build \
            -f tools/docker/php-debug.Dockerfile \
            --build-arg "PHP_VERSION=${{ matrix.php }}" \
            -t generics-php:debug .

      - name: Confirm the image really is a debug build
        run: |
          docker run --rm generics-php:debug php -r 'exit(PHP_DEBUG ? 0 : 1);' \
            || { echo "::error::PHP_DEBUG is not set - the leak gate would be inert"; exit 1; }

      # The group being empty is the bug this job exists to prevent coming back: PHPUnit exits
      # non-zero with "No tests executed!", which reads like an ordinary failure. Counting the
      # tests makes the real cause name itself.
      - name: Run the destructive group with process isolation
        run: |
          mkdir -p var
          docker run --rm -v "$PWD:/app" -w /app generics-php:debug \
            vendor/bin/phpunit --group internal --process-isolation --log-junit /app/var/internal.xml
          count=$(grep -o 'tests="[0-9]*"' var/internal.xml | head -1 | grep -o '[0-9]*')
          skipped=$(grep -o 'skipped="[0-9]*"' var/internal.xml | head -1 | grep -o '[0-9]*')
          echo "internal group: ${count:-0} test(s), ${skipped:-0} skipped"
          [ "${count:-0}" -gt 0 ] \
            || { echo "::error::The internal group is empty - composer test:internal verifies nothing"; exit 1; }
          # A skip is the other way this job goes green having tested nothing: RequiresEngine
          # skips the whole class when Core::init() did not run, and PHPUnit still reports those
          # as tests. The image bakes ffi.enable=1 precisely so this cannot happen - if it ever
          # does, the cause is the container, not the test.
          [ "${skipped:-0}" -eq 0 ] \
            || { echo "::error::${skipped} destructive test(s) skipped - the debug container cannot reach the engine"; exit 1; }

  static-analysis:
    name: PHPStan (level max, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Run static analysis
        run: composer phpstan

  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Check coding standards
        run: composer cs:check
